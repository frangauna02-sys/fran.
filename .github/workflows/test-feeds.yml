name: Probar fuentes

# Prueba las fuentes en ramas de trabajo, sin guardar ni publicar nada.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar todas las fuentes
        run: python scripts/fetch_news.py
